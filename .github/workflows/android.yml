name: Android CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MurotalAudioEditor-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Collect LAME source
        run: |
          mkdir -p lame-source
          cp -r $(find app/.cxx -type d -path '*/lame_source-src/androidlame/src/main/jni/libmp3lame' | head -1) lame-source/
          cp app/src/main/assets/LAME-*.txt lame-source/
      - uses: actions/upload-artifact@v4
        with:
          name: LAME-corresponding-source
          path: lame-source/

  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: app/build/reports/androidTests/
